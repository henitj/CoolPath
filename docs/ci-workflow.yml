# Kept at docs/ci-workflow.yml (not .github/workflows/) on purpose: the GitHub App token used by
# tooling here cannot create or update workflow files, so a repo admin must move this file to
# .github/workflows/ci.yml to switch CI on. Backend job = offline pytest + snapshot determinism;
# frontend job = npm ci, lint, typecheck, build and both vitest suites.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Generate snapshot (determinism check)
        run: python scripts/build_snapshot.py --seed 42
      - name: Test (offline)
        env:
          COOLPATH_OFFLINE_MODE: "1"
          COOLPATH_LIVE_REFRESH_ON_STARTUP: "0"
        run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
